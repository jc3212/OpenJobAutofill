<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <title>Greenhouse Job Application</title>
</head>
<body>
  <div id="application-form" class="application-form">
    <h1>Software Engineer Application</h1>

    <!-- 1. Personal Information Section -->
    <section class="section card personal-info-section">
      <h2 class="section-title">Personal Information</h2>
      <div class="field-row">
        <label for="first_name">First Name <span class="required">*</span></label>
        <input type="text" id="first_name" name="first_name" required aria-label="First Name" placeholder="Enter first name" />
      </div>
      <div class="field-row">
        <label for="last_name">Last Name <span class="required">*</span></label>
        <input type="text" id="last_name" name="last_name" required aria-label="Last Name" placeholder="Enter last name" />
      </div>
      <div class="field-row">
        <label for="email">Email <span class="required">*</span></label>
        <input type="email" id="email" name="email" required aria-label="Email" placeholder="you@example.com" />
      </div>
      <div class="field-row">
        <label for="phone">Phone <span class="required">*</span></label>
        <input type="tel" id="phone" name="phone" required aria-label="Phone Number" placeholder="(555) 000-0000" />
      </div>
      <div class="field-row">
        <label for="linkedin_url">LinkedIn Profile</label>
        <input type="url" id="linkedin_url" name="linkedin_url" aria-label="LinkedIn Profile" placeholder="https://linkedin.com/in/..." />
      </div>
      <div class="field-row">
        <label for="website_url">Website or Portfolio</label>
        <input type="url" id="website_url" name="website_url" aria-label="Portfolio URL" placeholder="https://mywebsite.com" />
      </div>
    </section>

    <!-- 2. Education Section -->
    <section class="section card education-section">
      <h2 class="section-title">Education</h2>
      <div class="education-item repeater-item">
        <div class="field-row">
          <label for="school_name">School</label>
          <input type="text" id="school_name" name="school_name" aria-label="School" placeholder="University or college name" />
        </div>
        <div class="field-row">
          <label for="degree">Degree</label>
          <input type="text" id="degree" name="degree" aria-label="Degree" placeholder="Bachelor, Master, etc." />
        </div>
        <div class="field-row">
          <label for="field_of_study">Discipline / Major</label>
          <input type="text" id="field_of_study" name="field_of_study" aria-label="Field of Study" placeholder="Computer Science, etc." />
        </div>
        <div class="field-row">
          <label for="edu_start_date">Start Date</label>
          <input type="month" id="edu_start_date" name="edu_start_date" aria-label="Education Start Date" />
        </div>
        <div class="field-row">
          <label for="edu_end_date">End Date</label>
          <input type="month" id="edu_end_date" name="edu_end_date" aria-label="Education End Date" />
        </div>
      </div>
    </section>

    <!-- 3. Experience Section -->
    <section class="section card work-section">
      <h2 class="section-title">Employment History</h2>
      <div class="work-item repeater-item">
        <div class="field-row">
          <label for="company_name">Company Name</label>
          <input type="text" id="company_name" name="company_name" aria-label="Company Name" placeholder="Current or past employer" />
        </div>
        <div class="field-row">
          <label for="job_title">Title</label>
          <input type="text" id="job_title" name="job_title" aria-label="Job Title" placeholder="Software Engineer, etc." />
        </div>
        <div class="field-row">
          <label for="work_start_date">Start Date</label>
          <input type="month" id="work_start_date" name="work_start_date" aria-label="Work Start Date" />
        </div>
        <div class="field-row">
          <label for="work_end_date">End Date</label>
          <input type="month" id="work_end_date" name="work_end_date" aria-label="Work End Date" />
        </div>
        <div class="field-row">
          <label for="job_description">Responsibilities</label>
          <textarea id="job_description" name="job_description" aria-label="Responsibilities" placeholder="Describe your duties and achievements"></textarea>
        </div>
      </div>
    </section>

    <!-- 4. References Section (Negative Target Exclusion) -->
    <section class="section card references-section">
      <h2 class="section-title">Professional References</h2>
      <div class="field-row">
        <label for="reference_name">Reference Name</label>
        <input type="text" id="reference_name" name="reference_name" aria-label="Reference Name" placeholder="Full name of manager or referee" />
      </div>
      <div class="field-row">
        <label for="reference_phone">Reference Phone</label>
        <input type="tel" id="reference_phone" name="reference_phone" aria-label="Reference Phone" placeholder="Phone number of referee" />
      </div>
      <div class="field-row">
        <label for="supervisor_title">Supervisor Title</label>
        <input type="text" id="supervisor_title" name="supervisor_title" aria-label="Supervisor Title" placeholder="Title of former manager" />
      </div>
    </section>
  </div>
</body>
</html>
