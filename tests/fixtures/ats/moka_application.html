<!DOCTYPE html>
<html lang="zh-CN">
<head>
  <meta charset="UTF-8">
  <title>Moka 招聘职位申请</title>
</head>
<body>
  <div class="moka-container">
    <div class="header">高级全栈工程师申请表</div>

    <!-- 1. 基本信息 -->
    <div class="schema-form-item card module-section">
      <h3 class="module-title">基本信息</h3>
      <div class="field-item">
        <label class="field-label">姓名</label>
        <input type="text" name="candidateName" placeholder="请填写姓名" />
      </div>
      <div class="field-item">
        <label class="field-label">手机号</label>
        <input type="tel" name="phoneNumber" placeholder="请输入11位手机号码" />
      </div>
      <div class="field-item">
        <label class="field-label">电子邮箱</label>
        <input type="email" name="emailAddress" placeholder="用于接收面试通知" />
      </div>
      <div class="field-item">
        <label class="field-label">现居城市</label>
        <input type="text" name="residentCity" placeholder="当前所在城市" />
      </div>
      <div class="field-item">
        <label class="field-label">最高学历</label>
        <input type="text" name="highestDegree" placeholder="博士/硕士/本科/大专" />
      </div>
      <div class="field-item">
        <label class="field-label">工作年限</label>
        <input type="text" name="workYears" placeholder="如: 3年" />
      </div>
    </div>

    <!-- 2. 家庭及紧急联系人 (负向排除测试) -->
    <div class="schema-form-item card module-section">
      <h3 class="module-title">家庭及紧急联系人</h3>
      <div class="field-item">
        <label class="field-label">紧急联系人</label>
        <input type="text" name="iceName" placeholder="紧急联系人姓名" />
      </div>
      <div class="field-item">
        <label class="field-label">紧急联系人电话</label>
        <input type="tel" name="icePhone" placeholder="紧急联系人手机号" />
      </div>
      <div class="field-item">
        <label class="field-label">父亲姓名</label>
        <input type="text" name="fatherName" placeholder="父亲真实姓名" />
      </div>
      <div class="field-item">
        <label class="field-label">母亲姓名</label>
        <input type="text" name="motherName" placeholder="母亲真实姓名" />
      </div>
    </div>

    <!-- 3. 教育经历 -->
    <div class="schema-form-item card module-section">
      <h3 class="module-title">教育经历</h3>
      <div class="experience-item repeater-item">
        <div class="field-item">
          <label class="field-label">学校名称</label>
          <input type="text" name="eduSchool" placeholder="毕业院校全称" />
        </div>
        <div class="field-item">
          <label class="field-label">主修专业</label>
          <input type="text" name="eduMajor" placeholder="主修专业名称" />
        </div>
        <div class="field-item">
          <label class="field-label">学历学位</label>
          <input type="text" name="eduDegree" placeholder="所获学位" />
        </div>
        <div class="field-item">
          <label class="field-label">开始时间</label>
          <input type="month" name="eduStart" />
        </div>
        <div class="field-item">
          <label class="field-label">毕业时间</label>
          <input type="month" name="eduEnd" />
        </div>
      </div>
    </div>

    <!-- 4. 工作经历 -->
    <div class="schema-form-item card module-section">
      <h3 class="module-title">工作经历</h3>
      <div class="experience-item repeater-item">
        <div class="field-item">
          <label class="field-label">公司名称</label>
          <input type="text" name="workCompany" placeholder="就职单位全称" />
        </div>
        <div class="field-item">
          <label class="field-label">职位名称</label>
          <input type="text" name="workRole" placeholder="岗位职称" />
        </div>
        <div class="field-item">
          <label class="field-label">所属部门</label>
          <input type="text" name="workDept" placeholder="研发部等" />
        </div>
        <div class="field-item">
          <label class="field-label">开始时间</label>
          <input type="month" name="workStart" />
        </div>
        <div class="field-item">
          <label class="field-label">结束时间</label>
          <input type="month" name="workEnd" />
        </div>
        <div class="field-item">
          <label class="field-label">工作内容</label>
          <textarea name="workDesc" placeholder="项目及工作成果描述"></textarea>
        </div>
        <div class="field-item">
          <label class="field-label">推荐人姓名</label>
          <input type="text" name="refName" placeholder="前公司主管姓名" />
        </div>
        <div class="field-item">
          <label class="field-label">推荐人电话</label>
          <input type="tel" name="refPhone" placeholder="前公司主管联系电话" />
        </div>
      </div>
    </div>

    <!-- 5. 求职意向 -->
    <div class="schema-form-item card module-section">
      <h3 class="module-title">求职意向</h3>
      <div class="field-item">
        <label class="field-label">期望工作城市</label>
        <input type="text" name="targetCity" placeholder="意向工作地点" />
      </div>
      <div class="field-item">
        <label class="field-label">期望月薪</label>
        <input type="text" name="targetSalary" placeholder="期望月度薪酬" />
      </div>
    </div>
  </div>
</body>
</html>
